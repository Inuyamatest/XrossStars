# クロスファイト（smash-game/）のテストと Windows 用 exe の作成
name: クロスファイト exe ビルド

on:
  push:
    paths:
      - 'smash-game/**'
      - '.github/workflows/smash-game-build.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smash-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m tests.test_sim

  windows-exe:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: smash-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name CrossFight main.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrossFight-windows
          path: smash-game/dist/CrossFight.exe
