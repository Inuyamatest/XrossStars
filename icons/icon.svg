      <stop offset="0" stop-color="#1a2f5c"/>
      <stop offset=".55" stop-color="#0f1d3a"/>
      <stop offset="1" stop-color="#070f22"/>
    </radialGradient>
    <radialGradient id="gb" cx="22%" cy="78%" r="55%"><stop offset="0" stop-color="#62c5ee" stop-opacity=".35"/><stop offset="1" stop-color="#62c5ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gp" cx="80%" cy="22%" r="55%"><stop offset="0" stop-color="#ff5c9d" stop-opacity=".35"/><stop offset="1" stop-color="#ff5c9d" stop-opacity="0"/></radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8ecff"/><stop offset=".45" stop-color="#62c5ee"/><stop offset="1" stop-color="#3b6cff"/></linearGradient>
    <linearGradient id="pink" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2dc"/><stop offset=".45" stop-color="#ff5c9d"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#78b4ff" stroke-opacity=".09" stroke-width="2"/></pattern>
